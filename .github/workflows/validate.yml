name: Validate Runethread Hosted

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA"...HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi

      - name: Test development policy guard
        run: |
          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py

      - name: Enforce development policy
        run: python3 scripts/check_development_policy.py

  toolchain:
    name: toolchain (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Verify locked Node and npm identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check generated Worker types, TypeScript, and Workers runtime behavior
        run: npm run check

  validate:
    name: validate
    if: always()
    needs: [quality, toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TOOLCHAIN_RESULT" = "success"
