name: Release identity policy evidence v2

on:
  push:
    branches:
      - runethread/release-identity-baseline

permissions:
  contents: read

jobs:
  evidence:
    if: "${{ github.event.head_commit.message == 'chore: stage ADR-028 release policy evidence' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Simulate exact ADR-028 release-policy ratification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          ROOT = Path.cwd()
          GUARD = ROOT / "scripts/check_development_policy.py"
          TESTS = ROOT / "scripts/check_development_policy_test.py"
          TEMP_WORKFLOW = ".github/workflows/release-identity-policy-evidence-v2.yml"

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement target, got {count}: {old[:120]!r}")
              return text.replace(old, new, 1)

          guard = GUARD.read_text(encoding="utf-8")

          guard = replace_once(
              guard,
              '    "package-lock.json",\n    "scripts/check_development_policy.py",\n    "scripts/check_development_policy_test.py",',
              '    "package-lock.json",\n    "release/identity-policy.json",\n    "scripts/check_development_policy.py",\n    "scripts/check_development_policy_test.py",\n    "scripts/release_identity.mjs",',
          )

          guard = replace_once(
              guard,
              '''EXPECTED_SCRIPTS = {
              "types:check": "wrangler types --check",
              "typecheck": "tsc --noEmit && tsc -p test/tsconfig.json --noEmit",
              "test": "vitest run",
              "check": "npm run types:check && npm run typecheck && npm test",
          }''',
              '''EXPECTED_SCRIPTS = {
              "types:check": "wrangler types --check",
              "typecheck": "tsc --noEmit && tsc -p test/tsconfig.json --noEmit",
              "test": "vitest run",
              "release:verify-ci": "node scripts/release_identity.mjs --mode ci --version v0.0.0-ci",
              "check": "npm run types:check && npm run typecheck && npm test && npm run release:verify-ci",
          }''',
          )

          guard = replace_once(
              guard,
              '    "package.json": "c805df3ba473aad27ba59ec29567a3d63ff44f988baf8d8b4eff5379f25685ca",',
              '    "package.json": "7167e5c7f333d716ea43e8b492a110283312d57416893bc7d090c77c4cfe9aa3",',
          )
          guard = replace_once(
              guard,
              '    "wrangler.jsonc": "156271834722bc94f4382c91bf7450d24e9ff5766cc11560babb23628f55ce45",',
              '    "wrangler.jsonc": "5edbb90b6d53027f4e24ed2589c43b3eee7638f6d1bc016179bbdd8a879eb039",',
          )

          for old, new in {
              '    "AGENTS.md": "c4ca7f3d5a040343c61c92d19528d33c9beead80",': '    "AGENTS.md": "c8df303ca14b57ecc22b79d2a46f97d4db9f309a",',
              '    "docs/CURRENT_MILESTONE.md": "03589f1c7641e1bd9aaab3334ef8e41bb3de0658",': '    "docs/CURRENT_MILESTONE.md": "b0d4a4089e47cb658e208a03b55052b97956c1fd",',
              '    "docs/DEVELOPMENT_PIPELINE.md": "42574faeef46e42a951ba9a83eab7b4a9dcd7a67",': '    "docs/DEVELOPMENT_PIPELINE.md": "a3da1a6ed672d2c8dc9722764eef8d97c114cba9",',
              '    ".github/pull_request_template.md": "553376106373fb5e988e8bd04eb59b320b215d48",': '    ".github/pull_request_template.md": "2883de95af5d586c4c0096ecdd870f34dadf9e7a",',
          }.items():
              guard = replace_once(guard, old, new)

          guard = replace_once(
              guard,
              'NON_AUTHORITY_LICENSE_METADATA_PATHS = frozenset({"package-lock.json"})',
              'NON_AUTHORITY_LICENSE_METADATA_PATHS = frozenset({"package-lock.json", "release/identity-policy.json"})',
          )

          guard = replace_once(
              guard,
              '''    expected = {
                  "$schema": "./node_modules/wrangler/config-schema.json",
                  "name": "runethread-hosted",
                  "main": "src/index.ts",
                  "compatibility_date": "2026-09-09",
                  "compatibility_flags": ["no_nodejs_compat", "no_nodejs_compat_v2"],
                  "workers_dev": False,
                  "preview_urls": False,
              }''',
              '''    expected = {
                  "$schema": "./node_modules/wrangler/config-schema.json",
                  "name": "runethread-hosted",
                  "main": "src/index.ts",
                  "compatibility_date": "2026-09-09",
                  "compatibility_flags": ["no_nodejs_compat", "no_nodejs_compat_v2"],
                  "workers_dev": False,
                  "preview_urls": False,
                  "minify": False,
                  "upload_source_maps": False,
                  "find_additional_modules": False,
                  "send_metrics": False,
                  "dependencies_instrumentation": {"enabled": False},
              }''',
          )

          constants_anchor = 'PACKAGE_LOCK_SHA256 = "dafea88d811a42ccb96a6b1f4cee69212732adb4f8e7b28ab4efb7997db13eb2"\n\nNODE_VERSION'
          constants_insert = '''PACKAGE_LOCK_SHA256 = "dafea88d811a42ccb96a6b1f4cee69212732adb4f8e7b28ab4efb7997db13eb2"
          RELEASE_IDENTITY_GIT_BLOBS = {
              "release/identity-policy.json": "19c3f087817f92468c4a7bf552f634ee0a06c194",
              "scripts/release_identity.mjs": "6751380c8a7230eb7c0be1d0710fbb38ed894e81",
          }
          RELEASE_VERSIONING_IDENTITY = {
              "scheme": "semver-2.0.0",
              "authority_repository": "runethread/core",
              "authority_git_commit": "60a5f5c83ac740e26d4f11db99de66fa7b8c914d",
              "authority_path": "docs/runethread/VERSIONING.md",
              "authority_git_blob": "d4c49b67892cfe769a7b25adf3f4efb21d95ed9a",
              "release_identifier_prefix": "v",
          }
          RELEASE_CORE_IDENTITY = {
              "runtime_release": "v0.9.0",
              "runtime_git_commit": "7f5cf86f23604426c7e8f69086fdcbe27fb86226",
              "contract_release": "v0.9.0",
              "contract_version": 9,
              "repository_format": 2,
              "memory_schema": 1,
              "index_format": 2,
              "trust_lock_version": 2,
              "bootstrap_protocol": 1,
              "bootstrap_verifier": "v0.6.0",
          }
          RELEASE_WORKER_IDENTITY = {
              "wrangler": "4.129.1",
              "compatibility_date": "2026-09-09",
              "compatibility_flags": ["no_nodejs_compat", "no_nodejs_compat_v2"],
              "generated_runtime_types_workerd": "1.20260907.1",
              "generated_types_sha256": "d67a9e9d72dd0d155fcfd187a64d83ab062db80f20b585dfa36904ee0c778b44",
              "wrangler_config_sha256": "5edbb90b6d53027f4e24ed2589c43b3eee7638f6d1bc016179bbdd8a879eb039",
          }
          RELEASE_BUILD_IDENTITY = {
              "node": "24.20.0",
              "npm": "11.19.0",
              "package_lock_sha256": PACKAGE_LOCK_SHA256,
              "node_env": "production",
              "wrangler_args": [
                  "deploy",
                  "--dry-run",
                  "--config",
                  "wrangler.jsonc",
                  "--x-provision=false",
                  "--x-auto-create=false",
              ],
              "deploy_artifact_paths": ["index.js"],
              "dry_run_auxiliary_paths": ["README.md"],
              "expected_deploy_artifacts": {
                  "index.js": "905ab7b489f99893812b422862dc8dd527790fe9cdd1a9f730e2514d552bf0cf"
              },
          }
          RELEASE_PROTOCOL_IDENTITIES = {
              "hosted_api": "not_implemented",
              "repository_runtime": "not_implemented",
              "candidate_envelope": "not_implemented",
              "finalization_evidence": "not_implemented",
              "audit_conformance": "not_implemented",
              "terminal_success_verification": "not_implemented",
              "terminal_disposition": "not_implemented",
              "safety_journal": "not_implemented",
              "publication": "not_implemented",
              "reconciliation": "not_implemented",
          }
          RELEASE_CAPABILITIES = {
              "authenticated_api": False,
              "repository_binding": False,
              "durable_state": False,
              "semantic_mutation": False,
              "publication": False,
              "deployment": False,
          }
          RELEASE_DISTRIBUTION_IDENTITIES = {
              "LICENSE": PERIMETER_LICENSE_SHA256,
              "LICENSE-MIT": HISTORICAL_MIT_LICENSE_SHA256,
              "LICENSE-APACHE-2.0": APACHE_2_LICENSE_SHA256,
              "LICENSING.md": LICENSING_POLICY_SHA256,
              "THIRD_PARTY_NOTICES.md": THIRD_PARTY_NOTICES_SHA256,
          }

          NODE_VERSION'''
          guard = replace_once(guard, constants_anchor, constants_insert)

          function_anchor = '''    return errors


def workflow_errors(text: str) -> list[str]:'''
          function_insert = '''    return errors


def release_identity_errors(root: Path, tracked_relatives: set[str]) -> list[str]:
              errors: list[str] = []
              for relative, expected_blob in RELEASE_IDENTITY_GIT_BLOBS.items():
                  if relative not in tracked_relatives:
                      errors.append(f"required release identity surface missing: {relative}")
                      continue
                  try:
                      data = (root / relative).read_bytes()
                  except OSError as exc:
                      errors.append(f"cannot read release identity surface {relative}: {exc}")
                      continue
                  actual_blob = git_blob_sha1(data)
                  if actual_blob != expected_blob:
                      errors.append(
                          f"{relative} must match exact reviewed release identity bytes: "
                          f"expected git blob {expected_blob}, got {actual_blob}"
                      )

              policy_path = root / "release/identity-policy.json"
              try:
                  policy = json.loads(policy_path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  errors.append(f"cannot parse release identity policy: {exc}")
                  return errors
              if not isinstance(policy, dict):
                  errors.append("release identity policy root must be an object")
                  return errors

              expected_root = {
                  "schema",
                  "component",
                  "publication_enabled",
                  "versioning",
                  "release_version",
                  "source",
                  "core",
                  "worker",
                  "build",
                  "protocols",
                  "capabilities",
                  "distribution",
              }
              if set(policy) != expected_root:
                  errors.append("release identity policy root keys must match the reviewed baseline")
              if policy.get("schema") != 1 or policy.get("component") != "runethread/hosted":
                  errors.append("release identity policy schema/component mismatch")
              if policy.get("publication_enabled") is not False:
                  errors.append("release identity baseline must remain non-publishing")
              if policy.get("versioning") != RELEASE_VERSIONING_IDENTITY:
                  errors.append("release versioning authority must match the immutable ADR-028/Core VERSIONING.md pin")
              if policy.get("release_version") != {"ci_reserved": "v0.0.0-ci"}:
                  errors.append("release CI identity must remain exactly v0.0.0-ci")
              if policy.get("source") != {
                  "repository": "runethread/hosted",
                  "release_branch": "main",
                  "require_clean_tracked_tree": True,
                  "require_protected_validate": True,
              }:
                  errors.append("release source eligibility policy must match the reviewed protected-main baseline")
              if policy.get("core") != RELEASE_CORE_IDENTITY:
                  errors.append("release Core/runtime/contract identity must match the immutable reviewed baseline")
              if policy.get("worker") != RELEASE_WORKER_IDENTITY:
                  errors.append("release Worker/provider identity must match the reviewed baseline")
              if policy.get("build") != RELEASE_BUILD_IDENTITY:
                  errors.append("release build/artifact identity must match the reviewed dry-run baseline")
              if policy.get("protocols") != RELEASE_PROTOCOL_IDENTITIES:
                  errors.append("unimplemented Hosted protocols must remain explicit not_implemented identities")
              if policy.get("capabilities") != RELEASE_CAPABILITIES:
                  errors.append("unimplemented Hosted capabilities must remain false")
              if policy.get("distribution") != {"required_files_sha256": RELEASE_DISTRIBUTION_IDENTITIES}:
                  errors.append("release distribution notice identities must match current licensing policy")
              return errors


def workflow_errors(text: str) -> list[str]:'''
          guard = replace_once(guard, function_anchor, function_insert)

          guard = replace_once(
              guard,
              '    errors.extend(exact_file_errors(root, TOOLCHAIN_SURFACE_SHA256, "toolchain/shell"))\n    errors.extend(wrangler_errors(root / "wrangler.jsonc"))',
              '    errors.extend(exact_file_errors(root, TOOLCHAIN_SURFACE_SHA256, "toolchain/shell"))\n    errors.extend(release_identity_errors(root, tracked_relatives))\n    errors.extend(wrangler_errors(root / "wrangler.jsonc"))',
          )
          GUARD.write_text(guard, encoding="utf-8")

          tests = TESTS.read_text(encoding="utf-8")
          release_tests = r'''

          class ReleaseIdentityPolicyTests(unittest.TestCase):
              def _copy_surfaces(self, root: Path) -> set[str]:
                  tracked = {"release/identity-policy.json", "scripts/release_identity.mjs"}
                  for relative in tracked:
                      target = root / relative
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(PROJECT_ROOT / relative, target)
                  return tracked

              def test_exact_release_identity_policy_is_allowed(self) -> None:
                  from check_development_policy import release_identity_errors
                  self.assertEqual(release_identity_errors(PROJECT_ROOT, set(TRACKED_FILES)), [])

              def test_missing_release_identity_surface_is_rejected(self) -> None:
                  from check_development_policy import release_identity_errors
                  for missing in ("release/identity-policy.json", "scripts/release_identity.mjs"):
                      with self.subTest(missing=missing):
                          self.assertTrue(release_identity_errors(PROJECT_ROOT, set(TRACKED_FILES) - {missing}))

              def test_versioning_authority_and_authority_capability_drift_are_rejected(self) -> None:
                  from check_development_policy import release_identity_errors
                  mutations = (
                      ("versioning", "scheme", "calendar"),
                      ("versioning", "authority_git_commit", "0" * 40),
                      ("versioning", "authority_git_blob", "0" * 40),
                      ("versioning", "release_identifier_prefix", "x"),
                      ("protocols", "hosted_api", "1"),
                      ("capabilities", "publication", True),
                  )
                  for section, key, value in mutations:
                      with self.subTest(section=section, key=key), tempfile.TemporaryDirectory() as tmp:
                          root = Path(tmp)
                          tracked = self._copy_surfaces(root)
                          policy_path = root / "release/identity-policy.json"
                          policy = json.loads(policy_path.read_text(encoding="utf-8"))
                          policy[section][key] = value
                          policy_path.write_text(json.dumps(policy, indent=2) + "\n", encoding="utf-8")
                          self.assertTrue(release_identity_errors(root, tracked))

              def test_publication_enable_is_rejected(self) -> None:
                  from check_development_policy import release_identity_errors
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      tracked = self._copy_surfaces(root)
                      policy_path = root / "release/identity-policy.json"
                      policy = json.loads(policy_path.read_text(encoding="utf-8"))
                      policy["publication_enabled"] = True
                      policy_path.write_text(json.dumps(policy, indent=2) + "\n", encoding="utf-8")
                      self.assertTrue(release_identity_errors(root, tracked))

              def test_release_verifier_contains_semver_and_exact_manifest_boundaries(self) -> None:
                  text = (PROJECT_ROOT / "scripts/release_identity.mjs").read_text(encoding="utf-8")
                  for marker in (
                      "SEMVER_2_0_0",
                      "verifySemverImplementation",
                      'release_identifier_prefix !== "v"',
                      "semver: semverValue",
                      "publication_enabled !== false",
                      "--x-provision=false",
                      "--x-auto-create=false",
                  ):
                      with self.subTest(marker=marker):
                          self.assertIn(marker, text)
          '''
          tests += release_tests
          TESTS.write_text(tests, encoding="utf-8")

          subprocess.run(["git", "rm", "--cached", TEMP_WORKFLOW], check=True)
          subprocess.run(["git", "add", str(GUARD), str(TESTS)], check=True)
          PY

          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py
          python3 scripts/check_development_policy.py
          git diff --check
          git diff --cached --check

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          for relative in (
              "scripts/check_development_policy.py",
              "scripts/check_development_policy_test.py",
              "release/identity-policy.json",
              "scripts/release_identity.mjs",
              "AGENTS.md",
              "docs/CURRENT_MILESTONE.md",
              "docs/DEVELOPMENT_PIPELINE.md",
              ".github/pull_request_template.md",
          ):
              data = Path(relative).read_bytes()
              print(f"{relative}_sha256={hashlib.sha256(data).hexdigest()}")
              print(f"{relative}_git_blob={subprocess.check_output(['git', 'hash-object', relative], text=True).strip()}")
          print(f"final_tree={subprocess.check_output(['git', 'write-tree'], text=True).strip()}")
          PY
