name: Generate licensing-correction evidence

on:
  push:
    branches:
      - runethread/toolchain-worker-shell

permissions:
  contents: read

jobs:
  evidence:
    if: "${{ github.event.head_commit.message == 'chore: stage licensing-correction evidence' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Construct and verify complete correction set without pushing
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/cloudflare/workerd/590f9f99475ef34fb4902a36d868e261709f7366/LICENSE -o LICENSE-APACHE-2.0
          printf '%s' '' | base64 --decode | gzip -dc > "$RUNNER_TEMP/apply-correction.py"
          python3 "$RUNNER_TEMP/apply-correction.py"
          git rm .github/workflows/licensing-correction-evidence.yml
          git add LICENSE-APACHE-2.0 THIRD_PARTY_NOTICES.md LICENSING.md scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py
          python3 scripts/check_development_policy.py
          git diff --cached --check
          printf 'APACHE_SHA256=%s\n' "$(sha256sum LICENSE-APACHE-2.0 | awk '{print $1}')"
          printf 'THIRD_PARTY_NOTICE_SHA256=%s\n' "$(sha256sum THIRD_PARTY_NOTICES.md | awk '{print $1}')"
          printf 'LICENSING_SHA256=%s\n' "$(sha256sum LICENSING.md | awk '{print $1}')"
          printf 'GUARD_SHA256=%s\n' "$(sha256sum scripts/check_development_policy.py | awk '{print $1}')"
          printf 'TEST_SHA256=%s\n' "$(sha256sum scripts/check_development_policy_test.py | awk '{print $1}')"
          printf 'FINAL_TREE=%s\n' "$(git write-tree)"
