name: Sync current-state governance locks

on:
  push:
    branches:
      - runethread/hosted-api-boundary-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch with branch-only write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync only reviewed current-state governance locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_development_policy.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '"README.md": "aa872d548ec2a675def61645a3603390a092b49f"':
                  '"README.md": "4f664836ed9629d04473a7d582bc7e693f57c6d0"',
              '"docs/CURRENT_MILESTONE.md": "c45c926a60c81201e1161c873d67509c58706963"':
                  '"docs/CURRENT_MILESTONE.md": "fe97af16b7426443b12ffbfb50f0d4ca82f92e97"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one governance-lock replacement target, got {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/sync-current-state-locks.yml
          git add scripts/check_development_policy.py

          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py
          python3 scripts/check_development_policy.py
          git diff --check
          git diff --cached --check

          expected_paths=$'.github/workflows/sync-current-state-locks.yml\nscripts/check_development_policy.py'
          actual_paths="$(git diff --cached --name-only | sort)"
          test "$actual_paths" = "$expected_paths"

          echo "readme_blob=$(git hash-object README.md)"
          echo "milestone_blob=$(git hash-object docs/CURRENT_MILESTONE.md)"
          echo "guard_blob=$(git hash-object scripts/check_development_policy.py)"
          echo "final_tree=$(git write-tree)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'policy: sync current-state governance locks'
          git push origin HEAD:runethread/hosted-api-boundary-v1
