name: Finalize permanent Hosted policy files

on:
  push:
    branches:
      - runethread/toolchain-worker-shell

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: stage final Hosted policy files' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact reviewed policy files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip -dc > "$RUNNER_TEMP/policy-files.tar"
          test "$(sha256sum "$RUNNER_TEMP/policy-files.tar" | awk '{print $1}')" = "44a9ebdb3f6ea238702b88bb918a871a934d77d2fbb4ec7e1cdb2b4e35c94ff6"
          tar -xf "$RUNNER_TEMP/policy-files.tar" -C .
          test "$(sha256sum scripts/check_development_policy.py | awk '{print $1}')" = "21124e1247a3e5462317cbf81ba3adfacd429e426fed51f52f9b38e5d603547e"
          test "$(sha256sum scripts/check_development_policy_test.py | awk '{print $1}')" = "305d91a64ed8c7d89bd5ae05bb5fdea55eaf807ce22a62a1b63a366ff5c3569c"
          chmod +x scripts/check_development_policy.py scripts/check_development_policy_test.py
          git rm .github/workflows/materialize-generated-files.yml
          git add scripts/check_development_policy.py scripts/check_development_policy_test.py
          git diff --cached --check
          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py
          python3 scripts/check_development_policy.py
          test "$(git ls-files '.github/workflows/*')" = ".github/workflows/validate.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: finalize Hosted toolchain and fail-closed shell candidate"
          git push origin HEAD:runethread/toolchain-worker-shell
