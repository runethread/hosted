name: Admit Hosted API boundary files

on:
  push:
    branches:
      - runethread/hosted-api-boundary-v1

permissions:
  contents: write

jobs:
  admit:
    if: "${{ github.event.head_commit.message == 'chore: admit Hosted API boundary files' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch with branch-only write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Admit only the reviewed API boundary paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_development_policy.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one policy replacement target, got {count}: {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    "docs/ARCHITECTURE_BASELINE.md",\n    "docs/CURRENT_MILESTONE.md",',
              '    "docs/ARCHITECTURE_BASELINE.md",\n    "docs/API_BOUNDARY.md",\n    "docs/CURRENT_MILESTONE.md",',
          )
          replace_once(
              '    "scripts/release_identity.mjs",\n    "src/index.ts",',
              '    "scripts/release_identity.mjs",\n    "src/api.ts",\n    "src/index.ts",',
          )
          replace_once(
              '    "src/index.ts",\n    "test/index.test.ts",',
              '    "src/index.ts",\n    "test/api.test.ts",\n    "test/index.test.ts",',
          )

          path.write_text(text, encoding='utf-8')
          PY

          # Construction machinery must not exist when the permanent repository policy is evaluated.
          git rm .github/workflows/admit-api-boundary.yml
          git add scripts/check_development_policy.py

          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py
          python3 scripts/check_development_policy.py
          git diff --check
          git diff --cached --check

          expected_paths=$'.github/workflows/admit-api-boundary.yml\nscripts/check_development_policy.py'
          actual_paths="$(git diff --cached --name-only | sort)"
          test "$actual_paths" = "$expected_paths"

          echo "guard_sha256=$(sha256sum scripts/check_development_policy.py | cut -d' ' -f1)"
          echo "guard_blob=$(git hash-object scripts/check_development_policy.py)"
          echo "final_tree=$(git write-tree)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'policy: admit Hosted API boundary files'
          git push origin HEAD:runethread/hosted-api-boundary-v1
