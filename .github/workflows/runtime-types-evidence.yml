name: Materialize exact runtime types

on:
  push:
    branches:
      - runethread/toolchain-worker-shell

permissions:
  contents: write

jobs:
  materialize-runtime-types:
    if: "${{ github.event.head_commit.message == 'chore: stage runtime-type materializer' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Materialize exact runtime types and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler types worker-configuration.d.ts
          test "$(sha256sum worker-configuration.d.ts | awk '{print $1}')" = "d67a9e9d72dd0d155fcfd187a64d83ab062db80f20b585dfa36904ee0c778b44"
          test "$(wc -c < worker-configuration.d.ts | tr -d ' ')" = "591279"
          grep -E "declare module ['\"]cloudflare:workers['\"]" worker-configuration.d.ts >/dev/null
          git rm .github/workflows/runtime-types-evidence.yml
          git add worker-configuration.d.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: materialize compatibility-locked Worker runtime types"
          git push origin HEAD:runethread/toolchain-worker-shell
