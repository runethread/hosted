name: Ratify proven toolchain policy

on:
  push:
    branches:
      - runethread/toolchain-worker-shell

permissions:
  contents: write

jobs:
  ratify:
    if: "${{ github.event.head_commit.message == 'chore: stage proven-policy ratifier' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact reviewed policy patch, verify, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum worker-configuration.d.ts | awk '{print $1}')" = "d67a9e9d72dd0d155fcfd187a64d83ab062db80f20b585dfa36904ee0c778b44"
          test "$(sha256sum package.json | awk '{print $1}')" = "c805df3ba473aad27ba59ec29567a3d63ff44f988baf8d8b4eff5379f25685ca"
          test "$(sha256sum .gitattributes | awk '{print $1}')" = "fdf103a524864b292f70b2f1bb3013d14964036fa2da47c90cba1232baa0054a"
          test "$(sha256sum tsconfig.json | awk '{print $1}')" = "329463c9460980c0cbe9a46ed658cbc341375089d48632a8f73c42affde7b03e"
          test "$(sha256sum test/tsconfig.json | awk '{print $1}')" = "95d5e81f279f22af644f8bdf99935473bf19d037789e07116cbbdf5799fcdb60"

          printf '%s' '' | base64 --decode | gzip -dc > "$RUNNER_TEMP/ratify.patch"
          test "$(sha256sum "$RUNNER_TEMP/ratify.patch" | awk '{print $1}')" = "7b3f93445b4c4a19366948196865ba7b64906ecf6d6287ce94075e9682dfe25c"
          git apply --check "$RUNNER_TEMP/ratify.patch"
          git apply "$RUNNER_TEMP/ratify.patch"
          git rm .github/workflows/ratify-toolchain-policy.yml

          test "$(sha256sum scripts/check_development_policy.py | awk '{print $1}')" = "97787ccce1d0fc14b9e760714ddbf454392fcc0b34dd2ea8990db4d54e02ff72"
          test "$(sha256sum scripts/check_development_policy_test.py | awk '{print $1}')" = "bcab17442130cad3646f93dd560632293257c1690caf5e16b648087033d64d55"
          test "$(sha256sum docs/CURRENT_MILESTONE.md | awk '{print $1}')" = "238e20090f4cb87f496af6728a9d3bd2006c6f47b15ed1ee4da49bbdb10ab6c6"
          test "$(sha256sum docs/DEVELOPMENT_PIPELINE.md | awk '{print $1}')" = "7e18b178f5378f043de54e5667042b67f9fabc174b439a020eb6af57febd2924"
          test "$(sha256sum .github/pull_request_template.md | awk '{print $1}')" = "aff8985b6dbe115d8a83dcacbaca501a13f34777704a849938c5fa24ec7c0e71"

          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py
          python3 scripts/check_development_policy.py

          git add scripts/check_development_policy.py scripts/check_development_policy_test.py docs/CURRENT_MILESTONE.md docs/DEVELOPMENT_PIPELINE.md .github/pull_request_template.md
          git diff --cached --check
          test "$(git ls-files '.github/workflows/*')" = ".github/workflows/validate.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "policy: ratify proven Hosted toolchain configuration"
          git push origin HEAD:runethread/toolchain-worker-shell
