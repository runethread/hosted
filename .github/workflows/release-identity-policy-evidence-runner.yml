name: Release identity policy evidence runner

on:
  push:
    branches:
      - runethread/release-identity-baseline

permissions:
  contents: read

jobs:
  evidence:
    if: "${{ github.event.head_commit.message == 'chore: execute ADR-028 ratification evidence' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Execute embedded evidence program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source_path = Path('.github/workflows/release-identity-policy-evidence-v2.yml')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          prefix = ' ' * 10
          code = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in lines[start:end])
          code = code.replace(
              'subprocess.run(["git", "rm", "--cached", TEMP_WORKFLOW], check=True)',
              'subprocess.run(["git", "rm", "--cached", "--ignore-unmatch", TEMP_WORKFLOW], check=True)',
          )

          subprocess.check_call([
              'git', 'rm', '--cached', '--ignore-unmatch',
              '.github/workflows/release-identity-policy-evidence-v2.yml',
              '.github/workflows/release-identity-policy-evidence-runner.yml',
          ])
          compile(code, '<embedded-release-policy-evidence>', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

          python3 -m py_compile scripts/check_development_policy.py scripts/check_development_policy_test.py
          python3 scripts/check_development_policy_test.py
          python3 scripts/check_development_policy.py
          git diff --check
          git diff --cached --check

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          for relative in (
              "scripts/check_development_policy.py",
              "scripts/check_development_policy_test.py",
              "release/identity-policy.json",
              "scripts/release_identity.mjs",
              "AGENTS.md",
              "docs/CURRENT_MILESTONE.md",
              "docs/DEVELOPMENT_PIPELINE.md",
              ".github/pull_request_template.md",
          ):
              data = Path(relative).read_bytes()
              print(f"{relative}_sha256={hashlib.sha256(data).hexdigest()}")
              print(f"{relative}_git_blob={subprocess.check_output(['git', 'hash-object', relative], text=True).strip()}")
          print(f"final_tree={subprocess.check_output(['git', 'write-tree'], text=True).strip()}")
          PY
